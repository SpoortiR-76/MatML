services:
  - type: web
    name: matml-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LOG_LEVEL
        value: INFO
      # Update this after frontend is created on Render.
      - key: FRONTEND_URL
        value: https://matml-frontend.onrender.com

  - type: static
    name: matml-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to your backend Render URL after deploy.
      - key: VITE_API_URL
        value: https://matml-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
